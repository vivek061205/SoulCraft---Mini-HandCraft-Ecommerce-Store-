<article class="product-card">
  <a href="{% url 'store:product_detail' product.slug %}" class="product-media">
    {% if product.primary_image %}
      <img src="{{ product.primary_image }}" alt="{{ product.name }}" loading="lazy">
    {% else %}
      <div class="product-placeholder" aria-hidden="true">{{ product.name|slice:":1" }}</div>
    {% endif %}
  </a>
  <div class="product-body">
    <p class="product-category">{{ product.category.name }}</p>
    <h3 class="product-name"><a href="{% url 'store:product_detail' product.slug %}">{{ product.name }}</a></h3>
    <div class="product-foot">
      <span class="product-price">₹{{ product.price }}</span>
      {% if product.in_stock %}
        <form method="post" action="{% url 'store:cart_add' product.pk %}" class="inline-form">
          {% csrf_token %}
          <input type="hidden" name="quantity" value="1">
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button type="submit" class="btn btn--primary btn--sm">Add</button>
        </form>
      {% endif %}
    </div>
  </div>
</article>
